name: Bug report
description: Something in the review action does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. Never paste a private key.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: The action version (tag or SHA), the `network` and `pay-on` inputs, the job log, and the order id if a payment was made.
    validations:
      required: true
